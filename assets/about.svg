<svg xmlns="http://www.w3.org/2000/svg" width="880" height="222" viewBox="0 0 880 222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
